trust_bar:
  enabled: false
  label: "Approved workflows. Signed receipts. Reviewable evidence."
  items: []

sections:
  - type: "contract"
    id: "contract"
    enabled: true
    title: "No dashboard. No vague audit promise. One package."
    lede: "Every workflow follows the same order: scope, review, package, challenge."
    steps:
      - label: "Scope"
        body: "Pick one concrete security workflow, repo, finding, access path, agent action, or offsec handoff. Name what is in and out."
      - label: "Review"
        body: "Inspect the available evidence, classify the claim, and separate what is known from what still needs human or system proof."
      - label: "Package"
        body: "Return the evidence path, receipt, result, limits, and next action so the work can survive another reviewer."
      - label: "Challenge"
        body: "Make the claim easy to dispute, repeat, fix, or escalate instead of burying it in chat logs and screenshots."
    closing: "The output is a finished security-work package: what was reviewed, what supports it, what changed, and what still cannot be claimed."
    cta:
      label: "Read the package offer"
      href: "/review"
      variant: "ghost"

  - type: "workflows"
    id: "inputs"
    enabled: true
    title: "Bring one security workflow"
    lede: "Start with the security work you already need reviewed, fixed, explained, or handed off."
    cards:
      - title: "GitHub security work"
        body: "A finding, pull request, dependency risk, auth boundary, public surface, or remediation lane that needs reviewable evidence."
        proof_link: "/review/request"
        proof_link_label: "Describe GitHub security work"
      - title: "Codex and AI security"
        body: "A Codex Security finding, AI-agent action, prompt/tool boundary, exec surface, or agent workflow that needs claim control."
        proof_link: "/review/request"
        proof_link_label: "Describe Codex or AI security work"
      - title: "Security operations"
        body: "A governed offsec handoff, access decision, incident workflow, or remediation package where evidence must outlive the run."
        proof_link: "/review/request"
        proof_link_label: "Describe security workflow"
    surfaces:
      - title: "Scope map"
        body: "Name the repo, workflow, action, system, and boundary."
      - title: "Evidence package"
        body: "List the artifacts, commands, receipts, hashes, screenshots, reports, or records that support the claim."
      - title: "Decision record"
        body: "Separate finding, fix, blocked state, follow-up gate, and human review."
      - title: "Challenge path"
        body: "Explain what another reviewer can inspect, repeat, reject, or ask to strengthen."
    internal_surfaces_disclosure: "Some operational surfaces remain internal, including policy authoring, receipt query, and operator administration."
    ctas:
      - label: "Package one security workflow"
        href: "/review/request"
        variant: "primary"
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "ghost"

  - type: "verifiable_items"
    id: "verifiable"
    enabled: true
    title: "What another party can inspect"
    lede: "WitnessOps separates the security work from the proof package so the result can be reviewed after the run is over."
    items:
      - title: "What was actually in scope"
        body: "Whether the claim is tied to one named workflow, repo, finding, or action boundary."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What evidence supports it"
        body: "Whether the result points to receipts, manifests, commands, artifacts, or review records instead of assertion."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What remains unproven"
        body: "What could not be independently checked, what needs a human decision, and what should be challenged before reliance."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
    ctas:
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "primary"
      - label: "Read the verification contract"
        href: "/docs/how-it-works/verification"
        variant: "ghost"
    closing: "The public sample demonstrates receipt shape and verifier path only. It does not claim production deployment. It is not a legal compliance claim or complete AI governance program."

  - type: "boundary"
    id: "boundary"
    enabled: true
    title: "What is not claimed"
    lede: "WitnessOps reduces trust. It does not pretend to remove it completely."
    items:
      - title: "Runtime integrity"
        body: "The execution environment must be operated correctly. A compromised runtime could produce bad records."
      - title: "Key management"
        body: "Receipt signatures depend on key custody, rotation, and revocation discipline."
      - title: "Schema continuity"
        body: "Historical verification depends on stable, versioned receipt schemas."
      - title: "Policy enforcement"
        body: "Policy gates can record that evaluation happened. They do not prove every policy is perfect."
    closing: "Trust should be named, bounded, and kept as small as possible."

final_cta:
  enabled: true
  title: "Make one security workflow reviewable."
  body: "Bring one workflow: GitHub finding, Codex Security review, AI-agent action, access decision, offsec handoff, or remediation lane. Get a proof package: evidence, receipt, verifier result, named limits, and challenge path."
  ctas:
