        - "}"

trust_bar:
  enabled: false
  label: "Approved workflows. Signed receipts. Reviewable evidence."
  items: []

sections:
  - type: "contract"
    id: "contract"
    enabled: true
    title: "One action. One scoped package. Clear limits."
    lede: "Start with a fit check. If it is a match, WitnessOps agrees scope, fee, timing, and evidence handling before any proof run starts."
    steps:
      - label: "Scope"
        body: "Pick one action. Name what is in and out."
      - label: "Review"
        body: "Separate evidence from assumptions."
      - label: "Package"
        body: "Return evidence references, receipt artifacts where produced, limits, and next step."
      - label: "Challenge"
        body: "Make the result easy to inspect, reject, or strengthen."
    closing: "The output says what changed, what supports it, and what remains unproven or outside scope."
    cta:
      label: "Read the package offer"
      href: "/review"
      variant: "ghost"

  - type: "workflows"
    id: "inputs"
    enabled: true
    title: "Bring one bounded action"
    lede: "Start with work you already need to explain or hand off."
    cards:
      - title: "Code patch"
        body: "A fix, pull request, dependency risk, auth boundary, or remediation lane that needs reviewable evidence."
        proof_link: "/review/request"
        proof_link_label: "Describe the patch"
      - title: "Security finding"
        body: "A finding, AI-assisted review, tool output, or agent action that needs claim control."
        proof_link: "/review/request"
        proof_link_label: "Describe the finding"
      - title: "Access or operations change"
        body: "An access decision, incident step, security handoff, or workflow where evidence must outlive the run."
        proof_link: "/review/request"
        proof_link_label: "Describe the action"
    surfaces:
      - title: "Scope map"
        body: "Name the action, system, and boundary."
      - title: "Evidence package"
        body: "List the artifacts, commands, receipts, hashes, reports, or records."
      - title: "Decision record"
        body: "Separate finding, fix, blocked state, and follow-up gate."
      - title: "Challenge path"
        body: "Show what another reviewer can inspect, reject, or strengthen."
    internal_surfaces_disclosure: "Some operational surfaces remain internal, including policy authoring, receipt query, and operator administration."
    ctas:
      - label: "Start a review"
        href: "/review/request"
        variant: "primary"
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "ghost"

  - type: "verifiable_items"
    id: "verifiable"
    enabled: true
    title: "What can be inspected"
    lede: "The page is not the proof. A scoped package points to the evidence references and limits."
    items:
      - title: "What was actually in scope"
        body: "The named action, system, and boundary."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What evidence supports it"
        body: "The receipts, manifests, commands, artifacts, or review records referenced by the package."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What remains unproven"
        body: "The limits, assumptions, and decisions still outside the package."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
    ctas:
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "primary"
      - label: "Read the verification contract"
        href: "/docs/how-it-works/verification"
        variant: "ghost"
    closing: "The public sample demonstrates receipt shape and verifier path only. It does not claim production deployment. It is not a legal compliance claim or complete AI governance program. It is not whole-environment assurance."

  - type: "boundary"
    id: "boundary"
    enabled: true
    title: "What is not claimed"
    lede: "Proof packs reduce trust assumptions. They do not erase them."
    items:
      - title: "Runtime integrity"
        body: "The execution environment must be operated correctly. A compromised runtime could produce bad records."
      - title: "Key management"
        body: "Receipt signatures depend on key custody, rotation, and revocation discipline."
      - title: "Schema continuity"
        body: "Historical verification depends on stable, versioned receipt schemas."
      - title: "Policy enforcement"
        body: "Policy gates can record that evaluation happened. They do not prove every policy is perfect."
    closing: "Trust should be named, bounded, and kept as small as possible."

final_cta:
  enabled: true
  title: "Ready for a bounded review?"
  body: "Describe one situation without secrets. We confirm fit, scope, price and evidence handling before work starts."
  ctas:
    - label: "Start a review"
      href: "/review/request"
      variant: "primary"
    - label: "View services"
      href: "/catalog"
      variant: "ghost"

