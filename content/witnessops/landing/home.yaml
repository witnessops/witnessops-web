version: "1"
kind: "marketing.home"
site: "witnessops"
slug: "/"

status:
  draft: false
  canonical: true
  last_reviewed: "2026-04-25"

seo:
  title: "Bounded Proof Packs for Technical Trust | WitnessOps"
  description: "WitnessOps helps package one scoped workflow, patch, finding, or approval-gated action when available evidence, receipt artifacts, named limits, and inspection paths can be stated."
  canonical_url: "https://witnessops.com/"
  robots: "index,follow"
  og_image: "/og/home"
  og_title: "One bounded action. One scoped proof pack."
  og_description: "Bring one bounded action for review. If scope and evidence support it, get a package that names evidence references, receipt artifacts, limits, and an inspection path."
  twitter_card: "summary_large_image"

theme:
  brand: "witnessops"
  tone: "operator"
  proof_mark: "φ"

navbar:
  announcement:
    enabled: false
    text: ""
    href: ""
  links:
    - label: "Why WitnessOps"
      href: "/why-witnessops"
    - label: "Docs"
      href: "/docs"
    - label: "Verify"
      href: "/verify"
    - label: "Library"
      href: "/library"
    - label: "Support"
      href: "/support"
  cta:
    label: "Request one proof run"
    href: "/review/request"
    variant: "primary"

hero:
  eyebrow: "Bounded proof packs for technical trust"
  title: "One bounded action. One scoped proof pack."
  body: "Bring one workflow, patch, finding, access change, or approval-gated action for review. WitnessOps packages the boundary, available evidence, receipt artifacts, named limits, and inspection path when the scope supports it."
  ai_note:
    title: "What you get"
    body:
      - "We name the scope, package available evidence references, record what changed, and show what is still outside scope."
      - "If evidence is incomplete, the package says so."
    microcopy: "Not ready to submit work? Inspect the public sample first."
  supporting_points:
    - "Code patches"
    - "Security findings"
    - "AI-assisted review"
    - "Access changes"
    - "Receipt artifacts and limits"
  primary_cta:
    label: "Request one proof run"
    href: "/review/request"
    variant: "primary"
  secondary_cta:
    label: "Inspect sample package"
    href: "/review/sample-cases/ai-agent-action-proof-run"
    variant: "secondary"
  proof_badges:
    - "Scope"
    - "Evidence"
    - "Receipt"
    - "Limits"
    - "Inspection path"
  media:
    type: "code_excerpt"
    code:
      language: "json"
      lines:
        - "{"
        - "  \"workflow\": \"github-security-review\","
        - "  \"scope\": \"one finding, one repo\","
        - "  \"codexSecurity\": \"reviewed\","
        - "  \"evidenceManifest\": \"sha256:...\","
        - "  \"receipt\": \"signed\","
        - "  \"verifierResult\": \"bounded\","
        - "  \"limits\": \"declared\""
        - "}"

trust_bar:
  enabled: false
  label: "Approved workflows. Signed receipts. Reviewable evidence."
  items: []

sections:
  - type: "contract"
    id: "contract"
    enabled: true
    title: "One action. One scoped package. Clear limits."
    lede: "Scope it. Review available evidence. Package only what can be named. Make the limits inspectable."
    steps:
      - label: "Scope"
        body: "Pick one action. Name what is in and out."
      - label: "Review"
        body: "Separate evidence from assumptions."
      - label: "Package"
        body: "Return evidence references, receipt artifacts where produced, limits, and next step."
      - label: "Challenge"
        body: "Make the result easy to inspect, reject, or strengthen."
    closing: "The output says what changed, what supports it, and what remains unproven or outside scope."
    cta:
      label: "Read the package offer"
      href: "/review"
      variant: "ghost"

  - type: "workflows"
    id: "inputs"
    enabled: true
    title: "Bring one bounded action"
    lede: "Start with work you already need to explain or hand off."
    cards:
      - title: "Code patch"
        body: "A fix, pull request, dependency risk, auth boundary, or remediation lane that needs reviewable evidence."
        proof_link: "/review/request"
        proof_link_label: "Describe the patch"
      - title: "Security finding"
        body: "A finding, AI-assisted review, tool output, or agent action that needs claim control."
        proof_link: "/review/request"
        proof_link_label: "Describe the finding"
      - title: "Access or operations change"
        body: "An access decision, incident step, offsec handoff, or workflow where evidence must outlive the run."
        proof_link: "/review/request"
        proof_link_label: "Describe the action"
    surfaces:
      - title: "Scope map"
        body: "Name the action, system, and boundary."
      - title: "Evidence package"
        body: "List the artifacts, commands, receipts, hashes, reports, or records."
      - title: "Decision record"
        body: "Separate finding, fix, blocked state, and follow-up gate."
      - title: "Challenge path"
        body: "Show what another reviewer can inspect, reject, or strengthen."
    internal_surfaces_disclosure: "Some operational surfaces remain internal, including policy authoring, receipt query, and operator administration."
    ctas:
      - label: "Request one proof run"
        href: "/review/request"
        variant: "primary"
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "ghost"

  - type: "verifiable_items"
    id: "verifiable"
    enabled: true
    title: "What can be inspected"
    lede: "The page is not the proof. A scoped package points to the evidence references and limits."
    items:
      - title: "What was actually in scope"
        body: "The named action, system, and boundary."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What evidence supports it"
        body: "The receipts, manifests, commands, artifacts, or review records referenced by the package."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
      - title: "What remains unproven"
        body: "The limits, assumptions, and decisions still outside the package."
        proof_link: "/review/sample-cases/ai-agent-action-proof-run"
        proof_link_label: "Open sample package"
    ctas:
      - label: "Inspect sample package"
        href: "/review/sample-cases/ai-agent-action-proof-run"
        variant: "primary"
      - label: "Read the verification contract"
        href: "/docs/how-it-works/verification"
        variant: "ghost"
    closing: "The public sample demonstrates receipt shape and verifier path only. It does not claim production deployment. It is not a legal compliance claim or complete AI governance program."

  - type: "boundary"
    id: "boundary"
    enabled: true
    title: "What is not claimed"
    lede: "Proof packs reduce trust assumptions. They do not erase them."
    items:
      - title: "Runtime integrity"
        body: "The execution environment must be operated correctly. A compromised runtime could produce bad records."
      - title: "Key management"
        body: "Receipt signatures depend on key custody, rotation, and revocation discipline."
      - title: "Schema continuity"
        body: "Historical verification depends on stable, versioned receipt schemas."
      - title: "Policy enforcement"
        body: "Policy gates can record that evaluation happened. They do not prove every policy is perfect."
    closing: "Trust should be named, bounded, and kept as small as possible."

final_cta:
  enabled: true
  title: "Make one technical action reviewable."
  body: "Bring one workflow, patch, finding, or access change for review. If scope and evidence support it, get a proof pack naming boundary, evidence references, receipt artifacts, limits, and inspection path."
  ctas:
    - label: "Request one proof run"
      href: "/review/request"
      variant: "primary"
    - label: "Inspect sample package"
      href: "/review/sample-cases/ai-agent-action-proof-run"
      variant: "ghost"

