# Bugbot repository config. Cursor reads this from the pull request base branch.
# https://cursor.com/docs/bugbot
# Autofix stays disabled: the founder reviews and merges by hand.
version: 1

triggers:
  drafts: false
  frequency: everyPush

review:
  effort: smart
  smartPrompt: |
    Review public copy and catalogue edits against the offer and claim-boundary
    rules. Flag violations. Do not suggest weakening a test or a CI gate.

    Public new-sales offers are only Agent Action Security Review at €2,500
    excluding VAT and External Attack Surface Review at €1,900 excluding VAT.
    The public contact address is engage@mail.witnessops.com only.
    Delivery timing for both offers is exactly "Delivery timing per signed SOW".

    Held or historical prices and terms tracked in the commercial registry
    must never appear on public surfaces or in new-sales selection. Read
    apps/witnessops-web/src/lib/commercial-truth.ts and
    apps/witnessops-web/src/lib/historical-held-term-surfaces.test.tsx.
    Flag those held literals if they show up in current public copy.

    Historical offer names stay historical and must not be renamed onto a
    current offer: AI Agent Tools & Access Review, Public Exposure Review,
    Customer Security Review Sprint, One Server Security Check,
    Agent Risk & Control Review, Agent Workflow Reconstruction, and
    Early Bird — Internet Footprint Review.

    Do not introduce these as positive public claims: verified, certified,
    proof that a system is secure, signed as assurance, tamper-proof,
    independently verified, guaranteed, "your domain is secure", a check mark
    as a passed security result, Declared as an assurance label, or Not proven
    as a marketing heading.
    Approved replacements already used in the repo: checked; not verified;
    not a penetration test or certification; does not certify compliance;
    labelled sample; a proof claim requires a named receipt;
    External Exposure snapshots are unsigned; a report presents a recorded
    observation; tamper-evident evidence bindings; were not independently
    checked; does not guarantee; This is not a security guarantee.;
    A public hostname snapshot. No account needed. Not a review.;
    what remains unproven.
    Read content/witnessops/skills/claim-boundary-copy/SKILL.md and
    apps/witnessops-web/src/app/public-claim-boundary.test.ts before treating
    a claim sentence as acceptable.
  incremental: true

prSummary:
  mode: comment
  riskScore: true

autofix:
  mode: disabled
