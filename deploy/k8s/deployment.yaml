apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROD_DEPLOY}
  namespace: ${DEPLOY_NS}
  labels:
    app: ${PROD_DEPLOY}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${PROD_DEPLOY}
  template:
    metadata:
      labels:
        app: ${PROD_DEPLOY}
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ${APP_CONTAINER_NAME}
          image: ${IMAGE_PLACEHOLDER}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              hostIP: 127.0.0.1
              hostPort: 3000
          envFrom:
            - secretRef:
                name: ${BASE_ENV_SECRET}
            - secretRef:
                name: ${ADMIN_OIDC_SECRET}
          volumeMounts:
            - name: intake-store
              mountPath: /data/intake-store
            - name: intake-events
              mountPath: /data/intake-events
            - name: staging-mail-out
              mountPath: /data/mail-out
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: intake-store
          persistentVolumeClaim:
            claimName: ${INTAKE_STORE_PVC}
        - name: intake-events
          persistentVolumeClaim:
            claimName: ${INTAKE_EVENTS_PVC}
        - name: staging-mail-out
          persistentVolumeClaim:
            claimName: ${MAIL_OUT_PVC}
