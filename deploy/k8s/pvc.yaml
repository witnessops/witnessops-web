apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: witnessops-intake-store
  namespace: witnessops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: witnessops-intake-events
  namespace: witnessops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: witnessops-staging-mail-out
  namespace: witnessops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi