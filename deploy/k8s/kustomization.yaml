apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Informational resource inventory only; this file is not a deploy entrypoint.
# apply.sh renders topology and the build-recorded immutable image/config pair
# directly, then enforces runtime identity.
namespace: ${DEPLOY_NS}
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
