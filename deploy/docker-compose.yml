# Historical reference only: legacy Docker Compose / Goal0 deployment shape.
#
# This file is not current production authority for witnessops.com. Current
# production authority is documented in docs/DEPLOYMENT_CUSTODY.md and
# docs/DEPLOYMENT_AUTHORITY.md: ops-dev-01 runs Caddy, which proxies apex/www
# traffic to 127.0.0.1:3000 and the k3s witnessops-web deployment.
#
# Do not run compose from this file as a production operation without a new
# deployment authority lane. It is preserved as historical/reference material:
# TLS, public hostname handling, and any contact/review gate belonged to the
# legacy host Caddy path, not to current k3s runtime authority.
#
# The image is pinned by the deploy script via the WITNESSOPS_WEB_IMAGE
# variable (a :vX.Y.Z tag resolved to an immutable @sha256 digest). Never edit
# the tag here by hand if this historical path is explicitly reactivated.

name: witnessops-web

services:
  witnessops-web:
    image: ${WITNESSOPS_WEB_IMAGE:?set WITNESSOPS_WEB_IMAGE to a pinned ghcr.io/...@sha256 ref}
    container_name: witnessops-web
    restart: unless-stopped

    # Runtime secrets and config live on the host, outside this repo.
    env_file:
      - /srv/witnessops/env/witnessops-web.env

    # Bind only to loopback. Caddy terminates TLS and proxies to this port.
    ports:
      - "127.0.0.1:3000:3000"

    # Persistent data. Host paths survive container recreation and are backed
    # up separately (see the production backup custody lane).
    volumes:
      - /srv/witnessops/data/intake-store:/data/intake-store
      - /srv/witnessops/data/intake-events:/data/intake-events
      - /srv/witnessops/data/staging-mail-out:/data/mail-out

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
