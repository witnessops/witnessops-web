<text x="1125" y="800" font-family="Inter, Arial, sans-serif" font-size="19" fill="#1A1D21">
  <tspan x="1125" dy="0">• Clearspace: X = 1/8 mark height</tspan>
  <tspan x="1125" dy="42">• Mark minimum: 24 px digital</tspan>
  <tspan x="1125" dy="42">• Stacked minimum: 160 px wide</tspan>
  <tspan x="1125" dy="42">• Horizontal minimum: 180 px wide</tspan>
  <tspan x="1125" dy="42">• Preserve the 746:427 mark ratio</tspan>
  <tspan x="1125" dy="42">• Do not alter the central gate/hourglass</tspan>
  <tspan x="1125" dy="42">• No gradients, shadows, outlines, or distortion</tspan>
