name: Validate AWS Phase 3 source

on:
  pull_request:
    paths:
      - "apps/witnessops-web/**"
      - "content/**"
      - "packages/**"
      - ".dockerignore"
      - ".github/workflows/aws-phase3-validate.yml"
      - ".github/workflows/aws-release.yml"
      - ".github/workflows/aws-release-reusable.yml"
      - "deploy/Dockerfile.aws"
      - "deploy/Dockerfile.aws.dockerignore"
      - "deploy/aws/*runtime-image.sh"
      - "deploy/aws/validate-trivy-image*"
      - "deploy/aws/inspect-oci-image*"
      - "deploy/aws/install-regctl.sh"
      - "deploy/aws/cloudformation/github-deployment-bootstrap.template.json"
      - "deploy/aws/github-deployment-contract.v1.json"
      - "deploy/aws/host/**"
      - "deploy/aws/phase3-adapter-workflow-contract.v1.json"
      - "deploy/aws/README.md"
      - "deploy/aws/validate-phase3.mjs"
      - "deploy/aws/validate-phase3.test.mjs"
      - "deploy/aws/validate-ecr-scan-findings.mjs"
      - "deploy/aws/validate-ecr-scan-findings.test.mjs"
      - "deploy/aws/validate-github-deployment.mjs"
      - "deploy/aws/validate-github-deployment.test.mjs"
      - "deploy/aws/verify-scan-evidence.mjs"
      - "deploy/aws/verify-scan-evidence.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate the bounded source
        run: |
          bash -n deploy/aws/host/install-witnessops-deploy-v1.sh
          bash deploy/aws/host/test_install_witnessops_deploy_v1.sh
          python3 -m py_compile deploy/aws/host/witnessops-deploy-v1
          python3 -m unittest deploy/aws/host/test_witnessops_deploy_v1.py
          node --test deploy/aws/validate-phase3.test.mjs
          node --test deploy/aws/validate-ecr-scan-findings.test.mjs
          python3 deploy/aws/inspect-oci-image.test.py
          node --test deploy/aws/validate-trivy-image.test.mjs
          node --test deploy/aws/verify-scan-evidence.test.mjs
          node --test deploy/aws/validate-github-deployment.test.mjs
          node deploy/aws/validate-github-deployment.mjs
          node deploy/aws/validate-phase3.mjs

  build_image:
    name: Build exact AWS image without publication authority
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Enable OCI image loading on the ephemeral runner
        run: |
          sudo mkdir -p /etc/docker
          sudo python3 -c 'import json,pathlib; p=pathlib.Path("/etc/docker/daemon.json"); c=json.loads(p.read_text()) if p.exists() else {}; c.setdefault("features", {})["containerd-snapshotter"]=True; p.write_text(json.dumps(c))'
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1

      - name: Build the linux-amd64 AWS image
        run: |
          set -euo pipefail
          docker buildx create --name aws-oci-builder --driver docker-container --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 --use
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.aws \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=${RUNNER_TEMP}/witnessops-web-aws.tar" \
            .
          docker load --input "${RUNNER_TEMP}/witnessops-web-aws.tar"
          image_digest="$(python3 deploy/aws/inspect-oci-image.py "${RUNNER_TEMP}/witnessops-web-aws.tar" | jq -r .image_digest)"
          docker tag "${image_digest}" "witnessops-web-aws-pr:${GITHUB_SHA}"

      - name: Verify the patched runtime packages and tools
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/sh \
            "witnessops-web-aws-pr:${GITHUB_SHA}" \
            -eu -c '
              installed_apk_version() {
                awk -v wanted="$1" '\''
                  $0 == "P:" wanted { found = 1; next }
                  found && /^V:/ { print substr($0, 3); exit }
                  found && /^$/ { exit 1 }
                '\'' /lib/apk/db/installed
              }
              test "$(installed_apk_version libcrypto3)" = "3.5.8-r0"
              test "$(installed_apk_version libssl3)" = "3.5.8-r0"
              node --version
              gws --version
            '

      - name: Test and independently scan the exact release image
        run: |
          bash deploy/aws/test-runtime-image.sh "witnessops-web-aws-pr:${GITHUB_SHA}"
          bash deploy/aws/scan-runtime-image.sh "${RUNNER_TEMP}/witnessops-web-aws.tar" "${RUNNER_TEMP}/aws-security"
          python3 deploy/aws/inspect-oci-image.py "${RUNNER_TEMP}/witnessops-web-aws.tar"

      - name: Retain tested image and independent findings
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aws-runtime-validation
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/witnessops-web-aws.tar
            ${{ runner.temp }}/aws-security/trivy.json
