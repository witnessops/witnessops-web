name: PR 347 exact health validation

on:
  push:
    branches:
      - validation/pr-347-health-775c233

permissions:
  contents: read

concurrency:
  group: pr-347-exact-health-validation
  cancel-in-progress: false

jobs:
  exact-health:
    name: Exact PR head Node 22 health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 775c233a715d6a9d457117eafdb6b7fc5f026d7e
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        run: |
          actual="$(git rev-parse HEAD)"
          expected="775c233a715d6a9d457117eafdb6b7fc5f026d7e"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Show validation runtime
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository health gate
        run: pnpm health
