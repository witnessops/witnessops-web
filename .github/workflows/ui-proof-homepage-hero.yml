name: Homepage Hero UI Proof

on:
  pull_request:
    paths:
      - "apps/witnessops-web/src/components/hero/**"
      - "apps/witnessops-web/src/components/marketing/hero.tsx"
      - "apps/witnessops-web/src/components/marketing/buyer-homepage.tsx"
      - "apps/witnessops-web/src/components/marketing/buyer-homepage.module.css"
      - "apps/witnessops-web/src/components/marketing/buyer-catalogue.tsx"
      - "apps/witnessops-web/src/components/marketing/buyer-service-detail.tsx"
      - "apps/witnessops-web/src/components/marketing/footer.tsx"
      - "apps/witnessops-web/src/components/marketing/public-contact-route.tsx"
      - "apps/witnessops-web/src/components/catalog/**"
      - "apps/witnessops-web/src/components/docs/**"
      - "apps/witnessops-web/src/components/docs-assistant/**"
      - "apps/witnessops-web/src/components/review-request/**"
      - "apps/witnessops-web/src/components/shared/cta-button.tsx"
      - "apps/witnessops-web/src/components/shared/mobile-navbar-menu.tsx"
      - "apps/witnessops-web/src/components/shared/navbar.tsx"
      - "apps/witnessops-web/src/components/shared/route-scroll-reset.tsx"
      - "apps/witnessops-web/src/app/(marketing)/catalog/**"
      - "apps/witnessops-web/src/app/(library)/library/**"
      - "apps/witnessops-web/src/app/docs/**"
      - "apps/witnessops-web/src/app/media-kit/**"
      - "apps/witnessops-web/src/app/pl/docs/**"
      - "apps/witnessops-web/src/app/review/request/**"
      - "apps/witnessops-web/src/app/review/sample-cases/ai-agent-action-proof-run/**"
      - "apps/witnessops-web/src/app/verify/skill/**"
      - "apps/witnessops-web/src/app/pl/review/request/**"
      - "apps/witnessops-web/src/app/page.tsx"
      - "apps/witnessops-web/src/app/globals.css"
      - "apps/witnessops-web/src/lib/asset-foundry-visuals.ts"
      - "apps/witnessops-web/src/lib/buyer-services.ts"
      - "apps/witnessops-web/src/lib/commercial-truth.ts"
      - "apps/witnessops-web/src/lib/public-i18n.ts"
      - "apps/witnessops-web/src/lib/public-contact.ts"
      - "apps/witnessops-web/src/lib/public-seo.ts"
      - "apps/witnessops-web/src/lib/review-request-context.ts"
      - "apps/witnessops-web/src/lib/review-request-confirmation.ts"
      - "apps/witnessops-web/src/lib/service-landings.ts"
      - "apps/witnessops-web/src/lib/server/ask-witnessops/commercial-fit-classifier.ts"
      - "apps/witnessops-web/src/lib/skill-verify/**"
      - "apps/witnessops-web/src/lib/skills/**"
      - "apps/witnessops-web/src/components/verify/**"
      - "apps/witnessops-web/public/samples/governed-agent-verifier-conformance/**"
      - "apps/witnessops-web/public/brand/**"
      - "apps/witnessops-web/public/media-kit/**"
      - "apps/witnessops-web/public/visuals/**"
      - "apps/witnessops-web/next.config.js"
      - "content/witnessops/landing/home.yaml"
      - "content/witnessops/docs/**"
      - "content/witnessops/skills/governed-agent-verifier/**"
      - "scripts/smoke-buyer-path.ts"
      - "tests/public-smoke/**"
      - "tests/ui-proof/**"
      - "playwright.config.ts"
      - "package.json"
      - "apps/witnessops-web/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ui-proof-homepage-hero.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-hero-ui-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage-hero-ui-proof:
    name: Homepage hero UI proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build witnessops-web
        run: pnpm --filter witnessops-web build

      - name: Run commercial-truth regression tests
        run: |
          pnpm --filter witnessops-web test
          pnpm smoke:buyer-path:test

      - name: Run homepage and navigation UI proof
        id: ui_proof
        continue-on-error: true
        run: pnpm ui-proof:hero:ci

      - name: Run governed verifier conformance UI proof
        id: skill_ui_proof
        continue-on-error: true
        run: pnpm ui-proof:skill-conformance

      - name: Require UI proof report
        run: test -f artifacts/ui-proof/homepage-hero/latest.json

      - name: Summarize UI proof report
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const reportPath = "artifacts/ui-proof/homepage-hero/latest.json";
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          console.log("## Homepage Hero UI Proof");
          console.log("");
          console.log(`- Status: \`${report.status}\``);
          console.log(`- Proof type: \`${report.proofType}\``);
          console.log(`- Schema: \`${report.schemaVersion}\``);
          console.log(`- Route: \`${report.route}\``);
          console.log(`- Commit: \`${report.commitSha}\``);
          console.log(`- Generated: \`${report.generatedAt}\``);
          console.log(`- Browser: \`${report.browser}\``);
          console.log(`- Asset: \`${report.asset.assetId}\``);
          console.log("");
          console.log("| Scenario | Severity | Status | Viewport | Failed checks |");
          console.log("| --- | --- | --- | --- | --- |");
          for (const scenario of report.scenarios) {
            const failedChecks = scenario.checks
              .filter((check) => check.status === "fail")
              .map((check) => check.name)
              .join(", ");
            console.log(
              `| ${scenario.scenario.name} | ${scenario.scenario.severity} | ${scenario.status} | ${scenario.scenario.viewport.width}×${scenario.scenario.viewport.height} | ${failedChecks || "—"} |`,
            );
          }
          console.log("");
          console.log(`Semantic proof step outcome: \`${process.env.UI_PROOF_OUTCOME}\``);
          if (process.env.UI_PROOF_OUTCOME !== "success") {
            console.log("");
            console.log("> Critical homepage hero UI proof failures are blocking after calibration. Warning-only scenarios remain non-blocking.");
          }
          NODE
        env:
          UI_PROOF_OUTCOME: ${{ steps.ui_proof.outcome }}

      - name: Upload UI proof artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: homepage-hero-ui-proof
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ui-proof/homepage-hero/latest.json
            artifacts/ui-proof/homepage-hero/grid.png
            artifacts/ui-proof/homepage-hero/screenshots/**
            artifacts/ui-proof/navigation-integrity/screenshots/**
            artifacts/ui-proof/playwright-report/**
            artifacts/ui-proof/test-results/**

      - name: Enforce UI proof blocking policy
        if: always()
        run: |
          test -f artifacts/ui-proof/homepage-hero/latest.json
          if [ "${{ steps.ui_proof.outcome }}" != "success" ]; then
            echo "Homepage or navigation UI proof failed a blocking gate."
            echo "Critical semantic failures, navigation-integrity failures, runner failures, or report-generation failures are blocking after calibration."
            echo "Warning-only scenario failures remain non-blocking because the Playwright spec only fails critical checks."
            exit 1
          fi
          echo "Homepage and navigation UI proof blocking policy passed."
          if [ "${{ steps.skill_ui_proof.outcome }}" != "success" ]; then
            echo "Governed verifier conformance UI proof failed."
            exit 1
          fi
          echo "Governed verifier conformance UI proof passed."
