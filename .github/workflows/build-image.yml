name: Build witnessops-web image

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "apps/witnessops-web/**"
      - "content/**"
      - "packages/**"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: witnessops-web-build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERFILE_PATH: apps/witnessops-web/Dockerfile
  RECEIPT_DIR: artifacts/build-image

jobs:
  build-image:
    name: Build, SBOM, and keyless-sign image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build witnessops-web standalone output
        run: pnpm --filter witnessops-web build

      - name: Set image metadata
        id: image
        run: |
          mkdir -p "${RECEIPT_DIR}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${image_name}:${GITHUB_SHA}"
          {
            echo "image_name=${image_name}"
            echo "image_tag=${image_tag}"
            echo "dockerfile=${DOCKERFILE_PATH}"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${image_tag}" > "${RECEIPT_DIR}/image-tag.txt"

      - name: Log in to GHCR with GitHub token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name witnessops-web-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push image
        run: |
          docker buildx build \
            --file "${DOCKERFILE_PATH}" \
            --tag "${{ steps.image.outputs.image_tag }}" \
            --push \
            --metadata-file "${RECEIPT_DIR}/image-metadata.json" \
            .

      - name: Record image digest
        id: digest
        run: |
          digest="$(node -e 'const fs = require("fs"); const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const digest = metadata["containerimage.digest"]; if (!digest) { process.exit(1); } console.log(digest);' "${RECEIPT_DIR}/image-metadata.json")"
          image_ref="${{ steps.image.outputs.image_name }}@${digest}"
          {
            echo "digest=${digest}"
            echo "image_ref=${image_ref}"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${digest}" > "${RECEIPT_DIR}/image-digest.txt"
          printf '%s\n' "${image_ref}" > "${RECEIPT_DIR}/image-ref.txt"

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.digest.outputs.image_ref }}
          format: spdx-json
          output-file: artifacts/build-image/sbom.spdx.json
          upload-artifact: false

      - name: Hash SBOM
        id: sbom
        run: |
          sbom_sha256="$(sha256sum "${RECEIPT_DIR}/sbom.spdx.json" | awk '{ print $1 }')"
          echo "sha256=${sbom_sha256}" >> "${GITHUB_OUTPUT}"
          printf '%s  %s\n' "${sbom_sha256}" "sbom.spdx.json" > "${RECEIPT_DIR}/sbom.spdx.json.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.0.3

      - name: Keyless-sign image with GitHub OIDC
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${{ steps.digest.outputs.image_ref }}"

      - name: Attach SBOM to image
        run: cosign attach sbom --sbom "${RECEIPT_DIR}/sbom.spdx.json" "${{ steps.digest.outputs.image_ref }}"

      - name: Smoke-verify image signature
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-image\\.yml@refs/(heads|tags)/.+$" \
            "${{ steps.digest.outputs.image_ref }}" \
            > "${RECEIPT_DIR}/cosign-verify.json"

      - name: Write receipt and verifier commands
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          SBOM_SHA256: ${{ steps.sbom.outputs.sha256 }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const receiptDir = process.env.RECEIPT_DIR;
          const digest = process.env.IMAGE_DIGEST;
          const digestHex = digest.startsWith("sha256:") ? digest.slice("sha256:".length) : digest;
          const identityRegexp = `^https://github.com/${process.env.GITHUB_REPOSITORY}/.github/workflows/build-image\\.yml@refs/(heads|tags)/.+$`;
          const commands = [
            `cosign verify --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --certificate-identity-regexp '${identityRegexp}' "${process.env.IMAGE_REF}"`,
            `rekor-cli search --sha "${digestHex}"`,
            `sha256sum sbom.spdx.json`,
          ];
          const receipt = {
            schema_version: "witnessops.build-image-receipt.v1",
            repo: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            workflow_ref: process.env.GITHUB_WORKFLOW_REF,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            actor: process.env.GITHUB_ACTOR,
            ref: process.env.GITHUB_REF,
            commit_sha: process.env.GITHUB_SHA,
            dockerfile: process.env.DOCKERFILE_PATH,
            source_checkout: {
              fetch_depth: 0,
              fetch_tags: true,
              persist_credentials: false,
            },
            image: {
              tag: process.env.IMAGE_TAG,
              digest,
              ref: process.env.IMAGE_REF,
            },
            sbom: {
              path: "sbom.spdx.json",
              format: "spdx-json",
              sha256: process.env.SBOM_SHA256,
              generated_from_image_ref: process.env.IMAGE_REF,
              attached_to_image_ref: process.env.IMAGE_REF,
            },
            signing: {
              method: "sigstore-cosign-keyless-github-oidc",
              oidc_issuer: "https://token.actions.githubusercontent.com",
              certificate_identity_regexp: identityRegexp,
              signature_smoke_check_artifact: "cosign-verify.json",
            },
            operator_setup_gaps: [
              "GHCR package write and package visibility settings are repository/operator setup surfaces; this workflow records failures from docker login, push, or cosign attach instead of proving those settings independently.",
            ],
            verifier_commands: commands,
          };
          fs.writeFileSync(`${receiptDir}/receipt.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          fs.writeFileSync(`${receiptDir}/verifier-commands.sh`, `#!/usr/bin/env bash\nset -euo pipefail\n${commands.join("\n")}\n`);
          NODE
          chmod +x "${RECEIPT_DIR}/verifier-commands.sh"

      - name: Summarize receipt
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          SBOM_SHA256: ${{ steps.sbom.outputs.sha256 }}
        run: |
          {
            echo "## Build Image Receipt"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Image ref: \`${IMAGE_REF}\`"
            echo "- Image digest: \`${IMAGE_DIGEST}\`"
            echo "- SBOM artifact: \`sbom.spdx.json\`"
            echo "- SBOM SHA-256: \`${SBOM_SHA256}\`"
            echo "- Signing: \`sigstore-cosign-keyless-github-oidc\`"
            echo ""
            echo "### Verifier commands"
            echo ""
            echo '```bash'
            sed -n '3,$p' "${RECEIPT_DIR}/verifier-commands.sh"
            echo '```'
            echo ""
            echo "### Operator setup gap"
            echo ""
            echo "GHCR package write and package visibility settings remain operator setup surfaces. A failed docker login, push, or SBOM attach records that setup gap; it is not proof that package settings are correct."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image receipt artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: witnessops-web-build-image-receipt
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/build-image/cosign-verify.json
            artifacts/build-image/image-digest.txt
            artifacts/build-image/image-metadata.json
            artifacts/build-image/image-ref.txt
            artifacts/build-image/image-tag.txt
            artifacts/build-image/receipt.json
            artifacts/build-image/sbom.spdx.json
            artifacts/build-image/sbom.spdx.json.sha256
            artifacts/build-image/verifier-commands.sh
