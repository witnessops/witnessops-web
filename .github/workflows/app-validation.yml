name: Authenticated app validation
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supply_chain_gate:
    name: App Supply Chain Gate
    uses: ./.github/workflows/supply-chain-gate.yml
    with:
      checkout_ref: ${{ github.sha }}
      base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'workflow_dispatch' && format('{0}^', github.sha) || 'MISSING_REQUIRED_COMPARISON_BASE' }}
    permissions:
      contents: read
  app:
    name: App tests, database and browser
    needs: supply_chain_gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: witnessops_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U app_test -d witnessops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dependency admission before package tooling
        env:
          ADMISSION_RESULT: ${{ needs.supply_chain_gate.result }}
          ADMISSION_STATUS: ${{ needs.supply_chain_gate.outputs.status }}
          ADMITTED_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
          ADMITTED_LOCK_SHA256: ${{ needs.supply_chain_gate.outputs.lockfile_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          case "${EVENT_NAME}" in
            pull_request) comparison_base="${PR_BASE}" ;;
            push) comparison_base="${PUSH_BEFORE}" ;;
            workflow_dispatch)
              [[ "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
              comparison_base="${EVENT_SHA}^"
              ;;
            *) echo "Unsupported app admission event." >&2; exit 1 ;;
          esac
          if [ "${EVENT_NAME}" != workflow_dispatch ]; then
            [[ "${comparison_base}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "${comparison_base}" != '0000000000000000000000000000000000000000' ]] || exit 1
            [[ "${comparison_base}" != "${EVENT_SHA}" ]] || exit 1
          fi
          git cat-file -e "${comparison_base}^{commit}" || exit 1
          python3 -I tools/supply-chain-gate/verify_install_admission.py
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Verify and prepare accepted producer (no operator checkout)
        run: |
          python tests/publication/producer_identity_test.py
          python tests/server-check/producer/prepare.py "$RUNNER_TEMP/accepted-producer"
          echo "WOPS_TEST_PYTHON=$RUNNER_TEMP/accepted-producer/venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare isolated database configuration
        run: |
          umask 077
          printf '%s\n' 'TEST_DATABASE_URL=postgres://app_test:disposable-ci-password@127.0.0.1:55432/witnessops_test' > apps/witnessops-app/.env.test.local
      - name: Acceptance gate and safe diagnostics regression
        run: node --test tests/publication/app-acceptance.test.mjs
      - name: Full repository health (app, CLI, verifier, report, lint, types)
        id: health
        run: pnpm health
      - name: Standard database tests
        id: db
        run: pnpm --filter @witnessops/app test:db
      - name: Live admission database tests
        id: db_live
        run: pnpm --filter @witnessops/app test:db:live
      - name: CLI authentication database tests
        id: db_cli
        run: pnpm --filter @witnessops/app test:db:cli
      - name: Server-check database tests
        id: db_server
        run: pnpm --filter @witnessops/app test:db:server
      - name: Populated migration upgrade
        id: migration
        run: node tests/publication/upgrade.mjs
      - name: App browser, CLI authorization, Linux and PDF paths
        id: browser
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:app-browser
      - name: Image parity and OCI regression
        id: parity
        run: |
          node --test deploy/aws/validate-phase3.test.mjs deploy/aws/verify-scan-evidence.test.mjs deploy/aws/validate-trivy-image.test.mjs
          python3 deploy/aws/inspect-oci-image.test.py
          python3 deploy/app/host/test_lifecycle.py
          git diff --check
      - name: Collect allowlisted failure diagnostics
        if: always()
        env:
          APP_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node tests/publication/safe-ci-diagnostics.mjs
      - name: Preserve safe app diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-test-diagnostics
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/app-safe-diagnostics/summary.json
  image:
    name: App image and authenticated runtime
    needs: supply_chain_gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dependency admission before package tooling
        env:
          ADMISSION_RESULT: ${{ needs.supply_chain_gate.result }}
          ADMISSION_STATUS: ${{ needs.supply_chain_gate.outputs.status }}
          ADMITTED_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
          ADMITTED_LOCK_SHA256: ${{ needs.supply_chain_gate.outputs.lockfile_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          case "${EVENT_NAME}" in
            pull_request) comparison_base="${PR_BASE}" ;;
            push) comparison_base="${PUSH_BEFORE}" ;;
            workflow_dispatch)
              [[ "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
              comparison_base="${EVENT_SHA}^"
              ;;
            *) echo "Unsupported app admission event." >&2; exit 1 ;;
          esac
          if [ "${EVENT_NAME}" != workflow_dispatch ]; then
            [[ "${comparison_base}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "${comparison_base}" != '0000000000000000000000000000000000000000' ]] || exit 1
            [[ "${comparison_base}" != "${EVENT_SHA}" ]] || exit 1
          fi
          git cat-file -e "${comparison_base}^{commit}" || exit 1
          python3 -I tools/supply-chain-gate/verify_install_admission.py
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - name: Enable OCI image loading on the ephemeral runner
        run: |
          sudo mkdir -p /etc/docker
          sudo python3 -c 'import json,pathlib; p=pathlib.Path("/etc/docker/daemon.json"); c=json.loads(p.read_text()) if p.exists() else {}; c.setdefault("features", {})["containerd-snapshotter"]=True; p.write_text(json.dumps(c))'
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      - name: Start disposable database after Docker configuration
        run: |
          docker run -d --name app-image-test-db -p 127.0.0.1:55432:5432 \
            -e POSTGRES_USER=app_test -e POSTGRES_PASSWORD=disposable-ci-password \
            -e POSTGRES_DB=witnessops_test --health-cmd='pg_isready -U app_test -d witnessops_test' \
            --health-interval=2s --health-timeout=5s --health-retries=30 postgres:17
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' app-image-test-db)" = healthy ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' app-image-test-db)" = healthy
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build one app candidate from exact tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/app-source" artifacts/app-validation
          git archive HEAD > "$RUNNER_TEMP/app-source.tar"
          source_hash=$(sha256sum "$RUNNER_TEMP/app-source.tar" | cut -d' ' -f1)
          tar -xf "$RUNNER_TEMP/app-source.tar" -C "$RUNNER_TEMP/app-source"
          docker buildx build --platform linux/amd64 --file "$RUNNER_TEMP/app-source/deploy/app/Dockerfile" \
            --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg SOURCE_DIRTY=false \
            --build-arg BUILD_INPUT_SHA256="$source_hash" --provenance=false \
            --output type=oci,dest=artifacts/app-validation/image.tar \
            --metadata-file artifacts/app-validation/build.json "$RUNNER_TEMP/app-source"
          python3 deploy/aws/inspect-oci-image.py artifacts/app-validation/image.tar > artifacts/app-validation/identity.json
          sha256sum artifacts/app-validation/image.tar > artifacts/app-validation/image.sha256
      - name: Independent exact-manifest Trivy (no suppression)
        run: bash deploy/aws/scan-runtime-image.sh artifacts/app-validation/image.tar artifacts/app-validation
      - name: Test exact scanned image with disposable authentication
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          umask 077
          printf '%s\n' 'TEST_DATABASE_URL=postgres://app_test:disposable-ci-password@127.0.0.1:55432/witnessops_test' > apps/witnessops-app/.env.test.local
          docker load -i artifacts/app-validation/image.tar
          config=$(node -p 'JSON.parse(require("fs").readFileSync("artifacts/app-validation/identity.json")).config_digest')
          manifest=$(node -p 'JSON.parse(require("fs").readFileSync("artifacts/app-validation/identity.json")).image_digest')
          test "$(docker inspect --format '{{.Id}}' "$manifest")" = "$manifest"
          database_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' app-image-test-db)
          test -n "$database_host"
          TEST_DATABASE_HOST="$database_host" TEST_IMAGE_ARCHIVE=artifacts/app-validation/image.tar TEST_IMAGE_REF="$manifest" TEST_IMAGE_CONFIG="$config" node --import ./apps/witnessops-web/scripts/register-server-only-test-stub.mjs --import tsx tests/publication/authenticated-image.mts | tee artifacts/app-validation/authenticated-runtime.json
      - name: Confirm tested archive bytes are unchanged
        run: sha256sum --check artifacts/app-validation/image.sha256
      - name: Retain tested app candidate (not production publication)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-image-candidate
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            artifacts/app-validation/image.tar
            artifacts/app-validation/image.sha256
            artifacts/app-validation/*.json
      - name: Preserve exact-image evidence (no publication/deployment)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-image-validation
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/app-validation/*.json
      - name: Remove disposable database
        if: always()
        run: docker rm -f app-image-test-db

  acceptance:
    name: App acceptance
    needs: [supply_chain_gate, app, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every app prerequisite to succeed
        shell: bash
        env:
          APP_ACCEPTANCE_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          required = ("supply_chain_gate", "app", "image")
          try:
              needs = json.loads(os.environ.get("APP_ACCEPTANCE_NEEDS", ""))
              accepted = isinstance(needs, dict) and set(needs) == set(required) and all(
                  isinstance(needs.get(key), dict) and needs[key].get("result") == "success"
                  for key in required
              )
          except (ValueError, TypeError):
              accepted = False
          if not accepted:
              print("App acceptance failed: every required prerequisite must succeed.", file=sys.stderr)
              sys.exit(1)
          print("App acceptance passed: supply_chain_gate, app and image succeeded.")
          PY
