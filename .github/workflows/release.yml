name: Release witnessops-web

# Cut a versioned, signed release from the trusted default-branch workflow.
# Authenticated operator trigger:
# gh api --method POST repos/witnessops/witnessops-web/dispatches \
#   -f event_type=release-witnessops-web -F 'client_payload[version]=v0.1.0'
# Dependency install and image packaging run without package-write or OIDC
# authority; a separate read-only job verifies the image, then the privileged
# job only publishes and signs it. This workflow never deploys production.

on:
  repository_dispatch:
    types: [release-witnessops-web]

permissions:
  contents: read

concurrency:
  group: witnessops-web-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERFILE_PATH: apps/witnessops-web/Dockerfile
  RECEIPT_DIR: artifacts/release

jobs:
  resolve_version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      tag_ref: ${{ steps.version.outputs.tag_ref }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      base_ref: ${{ steps.version.outputs.base_ref }}
    steps:
      - name: Check out authoritative main and release tags
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve exact release tag on authoritative main
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          python3 tools/supply-chain-gate/resolve_release_source.py \
            --repo-root . \
            --version "${REQUESTED_VERSION}" \
            --main-ref refs/remotes/origin/main \
            --github-output "${GITHUB_OUTPUT}"

  supply_chain_gate:
    name: Supply Chain Gate
    needs: resolve_version
    uses: ./.github/workflows/supply-chain-gate.yml
    with:
      checkout_ref: ${{ needs.resolve_version.outputs.commit_sha }}
      base_ref: ${{ needs.resolve_version.outputs.base_ref }}
    permissions:
      contents: read

  build:
    name: Low-authority dependency install and release build
    needs: [resolve_version, supply_chain_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      standalone_output_sha256: ${{ steps.archive.outputs.sha256 }}
      image_archive_sha256: ${{ steps.image_archive.outputs.sha256 }}
      manifest_digest: ${{ steps.image_archive.outputs.image_digest }}
      config_digest: ${{ steps.image_archive.outputs.config_digest }}
      source_commit: ${{ steps.image_archive.outputs.source_commit }}
      run_id: ${{ steps.image_archive.outputs.run_id }}
      run_attempt: ${{ steps.image_archive.outputs.run_attempt }}
    steps:
      - name: Check out the authorized release commit without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.resolve_version.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the gate and build use the same authorized commit
        env:
          ADMISSION_RESULT: ${{ needs.supply_chain_gate.result }}
          ADMISSION_STATUS: ${{ needs.supply_chain_gate.outputs.status }}
          ADMITTED_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          ADMITTED_LOCK_SHA256: ${{ needs.supply_chain_gate.outputs.lockfile_sha256 }}
          # The shared guard binds to the authorized release source, not dispatch main.
          EVENT_SHA: ${{ needs.resolve_version.outputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve_version.outputs.commit_sha }}
          GATE_SOURCE_COMMIT: ${{ needs.supply_chain_gate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "repository_dispatch" ]] || exit 1
          actual_source_commit="$(git rev-parse HEAD)"
          if [[ ! "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${actual_source_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]] || \
             [[ "${GATE_SOURCE_COMMIT}" != "${EXPECTED_SOURCE_COMMIT}" ]]; then
            echo "::error::release source identity changed between resolution, gate, and build"
            exit 1
          fi
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${WORKFLOW_SHA}" != "0000000000000000000000000000000000000000" ]] || exit 1
          # Load trusted workflow-revision code even when the release tag predates it.
          guard_path="$(mktemp "${RUNNER_TEMP}/release-admission.XXXXXX.py")"
          trap 'rm -f "${guard_path}"' EXIT
          git show "${WORKFLOW_SHA}:tools/supply-chain-gate/verify_install_admission.py" > "${guard_path}"
          python3 -I "${guard_path}"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install reviewed dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches tag
        env:
          EXPECTED_SEMVER: ${{ needs.resolve_version.outputs.semver }}
        run: |
          pkg_version="$(node -p "require('./apps/witnessops-web/package.json').version")"
          if [[ "${pkg_version}" != "${EXPECTED_SEMVER}" ]]; then
            echo "::error::apps/witnessops-web/package.json version (${pkg_version}) does not match tag (${EXPECTED_SEMVER}). Bump it in the release PR before tagging."
            exit 1
          fi

      - name: Build witnessops-web standalone output
        run: pnpm --filter witnessops-web build

      - name: Hash and archive standalone release output
        id: archive
        run: |
          mkdir -p artifacts/build-output
          tar -czf artifacts/build-output/witnessops-web-standalone.tar.gz \
            apps/witnessops-web/.next/standalone \
            apps/witnessops-web/.next/static \
            apps/witnessops-web/public
          build_output_sha256="$(sha256sum artifacts/build-output/witnessops-web-standalone.tar.gz | awk '{ print $1 }')"
          echo "sha256=${build_output_sha256}" >> "${GITHUB_OUTPUT}"
          printf '%s  %s\n' \
            "${build_output_sha256}" \
            "witnessops-web-standalone.tar.gz" \
            > artifacts/build-output/witnessops-web-standalone.tar.gz.sha256

      - name: Package the release image without registry or OIDC authority
        id: image_archive
        run: |
          local_image_tag="witnessops-web-build:${{ needs.resolve_version.outputs.commit_sha }}"
          docker buildx create --name witnessops-web-low-authority-release-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --file "${DOCKERFILE_PATH}" \
            --tag "${local_image_tag}" \
            --platform linux/amd64 --provenance=false --sbom=false \
            --output "type=oci,dest=artifacts/build-output/witnessops-web-image.tar" \
            --metadata-file artifacts/build-output/image-build-metadata.json \
            .
          python3 deploy/aws/inspect-oci-image.py artifacts/build-output/witnessops-web-image.tar > artifacts/build-output/identity.json
          {
            node -e 'for (const [k,v] of Object.entries(require("./artifacts/build-output/identity.json"))) console.log(k+"="+v)'
            echo "source_commit=$(git rev-parse HEAD)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"
          image_archive_sha256="$(sha256sum artifacts/build-output/witnessops-web-image.tar | awk '{ print $1 }')"
          echo "sha256=${image_archive_sha256}" >> "${GITHUB_OUTPUT}"
          printf '%s  %s\n' \
            "${image_archive_sha256}" \
            "witnessops-web-image.tar" \
            > artifacts/build-output/witnessops-web-image.tar.sha256

      - name: Transfer hashed low-authority outputs to the verifier job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: witnessops-web-release-low-authority-build-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            artifacts/build-output/image-build-metadata.json
            artifacts/build-output/witnessops-web-image.tar
            artifacts/build-output/witnessops-web-image.tar.sha256
            artifacts/build-output/witnessops-web-standalone.tar.gz
            artifacts/build-output/witnessops-web-standalone.tar.gz.sha256

  verify_artifact:
    name: Independently scan exact OCI image without publish authority
    needs: [resolve_version, supply_chain_gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ needs.resolve_version.outputs.commit_sha }}
      BUILD_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      GATE_SOURCE_COMMIT: ${{ needs.supply_chain_gate.outputs.commit_sha }}
      BUILD_RUN_ID: ${{ needs.build.outputs.run_id }}
      BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
      EXPECTED_IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.image_archive_sha256 }}
      EXPECTED_MANIFEST_DIGEST: ${{ needs.build.outputs.manifest_digest }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config_digest }}
    outputs:
      verified_image_archive_sha256: ${{ steps.verify.outputs.image_archive_sha256 }}
      manifest_digest: ${{ steps.verify.outputs.manifest_digest }}
      config_digest: ${{ steps.verify.outputs.config_digest }}
      report_sha256: ${{ steps.verify.outputs.report_sha256 }}
      binding_sha256: ${{ steps.verify.outputs.binding_sha256 }}
    steps:
      - name: Check out trusted workflow verification code only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/aws
            deploy/ghcr

      - name: Set up verification Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download exact low-authority build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witnessops-web-release-low-authority-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/build-output

      - name: Verify source and OCI identity, scan and bind original report
        id: verify
        env:
          EXPECTED_STANDALONE_OUTPUT_SHA256: ${{ needs.build.outputs.standalone_output_sha256 }}
        run: |
          printf '%s  %s\n' "${EXPECTED_STANDALONE_OUTPUT_SHA256}" artifacts/build-output/witnessops-web-standalone.tar.gz | sha256sum -c -
          node deploy/ghcr/evidence.mjs candidate artifacts/build-output
          node deploy/ghcr/scan.mjs artifacts/build-output
          node deploy/ghcr/evidence.mjs bind artifacts/build-output

      - name: Upload scan diagnostics separately, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: witnessops-web-release-scan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: artifacts/build-output/trivy.json

      - name: Transfer only successfully accepted OCI evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: witnessops-web-release-verified-image-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            artifacts/build-output/witnessops-web-image.tar
            artifacts/build-output/trivy.json
            artifacts/build-output/binding.json

  publish:
    name: Publish and sign verified release image
    needs: [resolve_version, supply_chain_gate, build, verify_artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash
    # Partial reruns are rejected by the build run/attempt binding. Rerun all jobs.
    env:
      SOURCE_COMMIT: ${{ needs.resolve_version.outputs.commit_sha }}
      BUILD_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      GATE_SOURCE_COMMIT: ${{ needs.supply_chain_gate.outputs.commit_sha }}
      BUILD_RUN_ID: ${{ needs.build.outputs.run_id }}
      BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
      EXPECTED_IMAGE_ARCHIVE_SHA256: ${{ needs.verify_artifact.outputs.verified_image_archive_sha256 }}
      EXPECTED_MANIFEST_DIGEST: ${{ needs.verify_artifact.outputs.manifest_digest }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.verify_artifact.outputs.config_digest }}
      EXPECTED_REPORT_SHA256: ${{ needs.verify_artifact.outputs.report_sha256 }}
      EXPECTED_BINDING_SHA256: ${{ needs.verify_artifact.outputs.binding_sha256 }}
      VERIFIER_RESULT: ${{ needs.verify_artifact.result }}
    steps:
      - name: Check out trusted workflow verification code only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/aws
            deploy/ghcr

      - name: Set up verification Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download exact verified release image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witnessops-web-release-verified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verified-image

      - name: Revalidate original report and binding before registry writes
        run: |
          node deploy/ghcr/evidence.mjs verify artifacts/verified-image
          bash deploy/aws/install-regctl.sh "${RUNNER_TEMP}/ghcr-tools"
          echo "REGCTL=${RUNNER_TEMP}/ghcr-tools/regctl" >> "${GITHUB_ENV}"

      - name: Set image metadata
        id: image
        env:
          SOURCE_COMMIT_SHA: ${{ needs.resolve_version.outputs.commit_sha }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          SEMVER: ${{ needs.resolve_version.outputs.semver }}
        run: |
          mkdir -p "${RECEIPT_DIR}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image_name=${image_name}"
            echo "tag_version=${image_name}:${VERSION}"
            echo "tag_semver=${image_name}:${SEMVER}"
            echo "tag_stable=${image_name}:stable"
            echo "tag_sha=${image_name}:${SOURCE_COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR with GitHub token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Verify remote main and the release tag still name the authorized commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve_version.outputs.commit_sha }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4; do
              case "${object_type}" in
                commit)
                  printf '%s\n' "${object_sha}"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *)
                  echo "::error::release tag resolved to unsupported object type '${object_type}'" >&2
                  return 1
                  ;;
              esac
            done
            echo "::error::release tag nesting exceeds the supported limit" >&2
            return 1
          }

          observed_main_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          observed_source_commit="$(resolve_remote_tag_commit)"
          if [[ ! "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "${observed_main_commit}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${observed_main_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]] || \
             [[ "${observed_source_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]]; then
            echo "::error::remote main or the release tag no longer resolves to the authorized source commit"
            exit 1
          fi

      - name: Publish the exact verified image without building or running it
        id: digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image_name }}
        run: node deploy/ghcr/publish.mjs stage artifacts/verified-image

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.digest.outputs.image_ref }}
          format: spdx-json
          output-file: artifacts/release/sbom.spdx.json
          upload-artifact: false

      - name: Hash SBOM
        id: sbom
        run: |
          sbom_sha256="$(sha256sum "${RECEIPT_DIR}/sbom.spdx.json" | awk '{ print $1 }')"
          echo "sha256=${sbom_sha256}" >> "${GITHUB_OUTPUT}"
          printf '%s  %s\n' "${sbom_sha256}" "sbom.spdx.json" > "${RECEIPT_DIR}/sbom.spdx.json.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.0.3

      - name: Keyless-sign image with GitHub OIDC
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${{ steps.digest.outputs.image_ref }}"

      - name: Attach SBOM to image
        run: cosign attach sbom --sbom "${RECEIPT_DIR}/sbom.spdx.json" "${{ steps.digest.outputs.image_ref }}"

      - name: Smoke-verify image signature
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            "${{ steps.digest.outputs.image_ref }}" \
            > "${RECEIPT_DIR}/cosign-verify.json"

      - name: Promote signed digest and independently re-read every consumer tag
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image_name }}
          CONSUMER_TAGS: '["${{ needs.resolve_version.outputs.version }}","${{ needs.resolve_version.outputs.semver }}","stable","${{ needs.resolve_version.outputs.commit_sha }}"]'
        run: node deploy/ghcr/publish.mjs promote artifacts/verified-image

      - name: Write release receipt
        env:
          STANDALONE_OUTPUT_SHA256: ${{ needs.build.outputs.standalone_output_sha256 }}
          IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.image_archive_sha256 }}
          VERIFIED_IMAGE_ARCHIVE_SHA256: ${{ needs.verify_artifact.outputs.verified_image_archive_sha256 }}
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          SOURCE_TAG_REF: ${{ needs.resolve_version.outputs.tag_ref }}
          SOURCE_COMMIT_SHA: ${{ needs.resolve_version.outputs.commit_sha }}
          SBOM_SHA256: ${{ steps.sbom.outputs.sha256 }}
          SUPPLY_CHAIN_STATUS: ${{ needs.supply_chain_gate.outputs.status }}
          SUPPLY_CHAIN_COMMIT_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          SUPPLY_CHAIN_PACKAGE_MANAGER: ${{ needs.supply_chain_gate.outputs.package_manager }}
          SUPPLY_CHAIN_LIFECYCLE_STATUS: ${{ needs.supply_chain_gate.outputs.lifecycle_status }}
          SUPPLY_CHAIN_GRAPH_SHA256: ${{ needs.supply_chain_gate.outputs.graph_sha256 }}
          SUPPLY_CHAIN_LOCKFILE_SHA256: ${{ needs.supply_chain_gate.outputs.lockfile_sha256 }}
          SUPPLY_CHAIN_PACKAGE_COUNT: ${{ needs.supply_chain_gate.outputs.package_count }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const dir = process.env.RECEIPT_DIR;
          const identity = `https://github.com/${process.env.GITHUB_WORKFLOW_REF}`;
          const receipt = {
            schema_version: "witnessops.release-receipt.v1",
            repo: process.env.GITHUB_REPOSITORY,
            version: process.env.VERSION,
            run_id: process.env.GITHUB_RUN_ID,
            commit_sha: process.env.SOURCE_COMMIT_SHA,
            source: {
              tag_ref: process.env.SOURCE_TAG_REF,
              commit_sha: process.env.SOURCE_COMMIT_SHA,
              authority_ref: "refs/remotes/origin/main",
            },
            supply_chain_gate: {
              status: process.env.SUPPLY_CHAIN_STATUS,
              commit_sha: process.env.SUPPLY_CHAIN_COMMIT_SHA,
              package_manager: process.env.SUPPLY_CHAIN_PACKAGE_MANAGER,
              lifecycle_review: process.env.SUPPLY_CHAIN_LIFECYCLE_STATUS,
              package_count: Number(process.env.SUPPLY_CHAIN_PACKAGE_COUNT),
              lockfile_sha256: process.env.SUPPLY_CHAIN_LOCKFILE_SHA256,
              package_graph_sha256: process.env.SUPPLY_CHAIN_GRAPH_SHA256,
            },
            build: {
              authority: "contents-read-no-secrets-no-oidc-no-package-write",
              dependency_install: "pnpm install --frozen-lockfile",
              result: "PASS",
              standalone_artifact_sha256: process.env.STANDALONE_OUTPUT_SHA256,
              image_archive_sha256: process.env.IMAGE_ARCHIVE_SHA256,
              source_checkout: {
                ref: process.env.SOURCE_COMMIT_SHA,
                fetch_depth: 0,
                fetch_tags: false,
                persist_credentials: false,
              },
            },
            artifact_verification: {
              authority: "contents-read-no-secrets-no-oidc-no-package-write",
              result: "PASS",
              verified_image_archive_sha256: process.env.VERIFIED_IMAGE_ARCHIVE_SHA256,
            },
            publish: {
              dependency_install: "NONE",
              source_checkout: "workflow-revision-verification-code-only",
              image_build: "NONE",
              image_execution: "NONE",
              authority: "contents-write-packages-write-id-token-write",
            },
            image: { ref: process.env.IMAGE_REF, digest: process.env.IMAGE_DIGEST },
            sbom: { path: "sbom.spdx.json", format: "spdx-json", sha256: process.env.SBOM_SHA256 },
            signing: {
              method: "sigstore-cosign-keyless-github-oidc",
              oidc_issuer: "https://token.actions.githubusercontent.com",
              certificate_identity: identity,
            },
            deploy_command: null,
            deployment: {
              performed: false,
              authority: "manual-internal-see-docs/DEPLOYMENT_AUTHORITY.md",
              intended_target: "prod-aws-frankfurt",
            },
            verifier_command: `cosign verify --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --certificate-identity "${identity}" "${process.env.IMAGE_REF}"`,
          };
          fs.writeFileSync(`${dir}/receipt.json`, JSON.stringify(receipt, null, 2) + "\n");
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve_version.outputs.commit_sha }}
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          TAG_VERSION: ${{ steps.image.outputs.tag_version }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4; do
              case "${object_type}" in
                commit)
                  printf '%s\n' "${object_sha}"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *)
                  echo "::error::release tag resolved to unsupported object type '${object_type}'" >&2
                  return 1
                  ;;
              esac
            done
            echo "::error::release tag nesting exceeds the supported limit" >&2
            return 1
          }

          observed_main_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          observed_source_commit="$(resolve_remote_tag_commit)"
          if [[ ! "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "${observed_main_commit}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${observed_main_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]] || \
             [[ "${observed_source_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]]; then
            echo "::error::remote main or the release tag changed before GitHub Release creation"
            exit 1
          fi

          notes="$(cat <<EOF
          ## witnessops-web ${VERSION}

          Signed container image published to GHCR.

          - **Image (immutable):** \`${IMAGE_REF}\`
          - **Tags:** \`${TAG_VERSION}\`, \`:stable\`
          - **Digest:** \`${IMAGE_DIGEST}\`
          - **SBOM:** attached to the image (spdx-json) and to this release
          - **Supply Chain Gate:** PASS; exact hashes are in the release receipt

          ### Deployment

          This workflow did not deploy production. Production execution remains
          manual/internal under \`docs/DEPLOYMENT_AUTHORITY.md\`; the intended
          target is the AWS Frankfurt production plane
          (\`prod-aws-frankfurt\`).

          ### Verify the signature

          \`\`\`bash
          cosign verify \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \\
            "${IMAGE_REF}"
          \`\`\`
          EOF
          )"
          gh release create "${VERSION}" \
            --verify-tag \
            --repo "${GITHUB_REPOSITORY}" \
            --title "witnessops-web ${VERSION}" \
            --notes "${notes}" \
            "${RECEIPT_DIR}/receipt.json#release-receipt.json" \
            "${RECEIPT_DIR}/sbom.spdx.json#sbom.spdx.json" \
            "${RECEIPT_DIR}/image-digest.txt#image-digest.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: witnessops-web-release-receipt
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts/release/receipt.json
            artifacts/release/image-digest.txt
            artifacts/release/image-ref.txt
            artifacts/release/image-metadata.json
            artifacts/release/cosign-verify.json
            artifacts/release/sbom.spdx.json
            artifacts/release/sbom.spdx.json.sha256

      - name: Preserve publication evidence even after a partial registry write
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: witnessops-web-release-registry-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.RECEIPT_DIR }}/registry-*.json
            artifacts/verified-image/binding.json
            artifacts/verified-image/trivy.json
