name: PDF Pagination Gate

on:
  pull_request:
    paths:
      - "apps/witnessops-web/src/components/proofpack/**"
      - "apps/witnessops-web/src/components/shared/witnessops-mark.tsx"
      - "apps/witnessops-web/src/lib/proofpack/**"
      - "apps/witnessops-web/src/components/external-exposure/**"
      - "apps/witnessops-web/src/lib/external-exposure/**"
      - "apps/witnessops-web/src/app/check/**"
      - "apps/witnessops-web/src/app/proofpack/**"
      - "apps/witnessops-web/src/app/globals.css"
      - "apps/witnessops-web/src/app/layout.tsx"
      - "packages/ui/tokens/witnessops.css"
      - "packages/ui/src/witnessops-mark.tsx"
      - "packages/ui/package.json"
      - "apps/witnessops-web/public/fonts/**"
      - "apps/witnessops-web/package.json"
      - "apps/witnessops-web/next.config.js"
      - "apps/witnessops-web/postcss.config.js"
      - "tests/external-exposure/**"
      - "tests/proofpack/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pdf-pagination.yml"
      - ".github/workflows/supply-chain-gate.yml"
      - "tools/supply-chain-gate/**"
      - "security/supply-chain/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply_chain_gate:
    uses: ./.github/workflows/supply-chain-gate.yml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ github.sha }}
      base_ref: ${{ github.event_name == 'workflow_dispatch' && format('{0}^', github.sha) || github.event.pull_request.base.sha || 'MISSING_REQUIRED_COMPARISON_BASE' }}

  pdf-pagination:
    needs: supply_chain_gate
    name: PDF Pagination Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject missing or unbound checkout identity
        env:
          ADMITTED_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          [[ "${ADMITTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${ADMITTED_SHA}" == "${EVENT_SHA}" ]]

      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify dependency admission before package tooling
        env:
          ADMISSION_RESULT: ${{ needs.supply_chain_gate.result }}
          ADMISSION_STATUS: ${{ needs.supply_chain_gate.outputs.status }}
          ADMITTED_SHA: ${{ needs.supply_chain_gate.outputs.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
          ADMITTED_LOCK_SHA256: ${{ needs.supply_chain_gate.outputs.lockfile_sha256 }}
        run: python3 -I tools/supply-chain-gate/verify_install_admission.py

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build witnessops-web
        run: pnpm --filter witnessops-web build

      - name: Gate A4 PDF pagination
        run: pnpm test:pdf-pagination
