name: Exact PR head health validation

on:
  push:
    branches:
      - validation/route-parity-baseline-20260903

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: c2f6038a683525de9cf432c741be75a57f977e6a
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: c2f6038a683525de9cf432c741be75a57f977e6a
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD" "$actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run full repository health
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          pnpm health
          test -z "$(git status --porcelain)"
